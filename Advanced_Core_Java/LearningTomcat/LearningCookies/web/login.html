<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">

    <title>Login</title>

    <style> </style>
</head>

<body>

<div class="login-box">

    <h2>Passenger Login</h2>

    <form action="login" method="post">

        <label>User ID</label>
        <input type="text"
               name="userId"
               placeholder="Enter User ID"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
